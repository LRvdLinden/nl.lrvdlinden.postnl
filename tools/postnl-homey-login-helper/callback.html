<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PostNL Homey Login Helper</title>
  <link rel="stylesheet" href="callback.css">
</head>
<body>
  <main>
    <img class="logo" src="icon.svg" alt="PostNL">
    <h1>PostNL-aanmelding ontvangen</h1>
    <p>De beveiligde callback is onderschept. De inhoud wordt niet zichtbaar gemaakt. Kopieer hem en plak hem in de PostNL App Settings van Homey.</p>
    <label for="callback">PostNL-callback</label>
    <input id="callback" type="password" readonly autocomplete="off" value="">
    <button id="copy" type="button">Callback kopiëren</button>
    <p id="status" role="status"></p>
    <p class="warning">De callback is eenmalig en tijdelijk geldig. Deel hem niet met anderen.</p>
  </main>
  <script src="callback.js"></script>
</body>
</html>
