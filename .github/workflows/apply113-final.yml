name: Apply PostNL v1.1.13 final patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply113-final.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/apply113.py
      - name: Validate
        run: |
          node --check drivers/account/driver.js
          node --check drivers/account/device.js
          node --check widgets/mijn-pakket/api.js
          node --check lib/delivery-image.js
          python -m json.tool app.json >/dev/null
          python -m json.tool drivers/account/driver.compose.json >/dev/null
      - name: Commit final v1.1.13
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drivers/account/driver.js drivers/account/device.js drivers/account/driver.compose.json widgets/mijn-pakket/api.js widgets/mijn-pakket/public/index.html lib/delivery-image.js app.json .homeychangelog.json .homeycompose/capabilities
          git rm tools/apply113.py .github/workflows/apply113-final.yml
          git commit -m "PostNL v1.1.13: global tokens, richer capabilities and full statuses"
          git push