name: Apply PostNL v1.2.3 widget previews
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply123-previews.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate previews
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct,zlib
          W,H=480,276
          O=(251,98,0); LB=(238,240,243); LC=(248,248,249); LP=(255,255,255); LBR=(217,217,222); LT=(119,121,130); LS=(183,185,193)
          DB=(15,19,36); DC=(21,26,45); DP=(32,38,58); DBR=(54,61,86); DT=(209,212,222); DS=(143,150,170)
          def png(path,pix):
              raw=b''.join(b'\x00'+bytes(sum(row,())) for row in pix)
              def ch(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              Path(path).write_bytes(b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>IIBBBBB',W,H,8,2,0,0,0))+ch(b'IDAT',zlib.compress(raw,9))+ch(b'IEND',b''))
          def canvas(theme):
              bg,card,panel,border,text,sub=(LB,LC,LP,LBR,LT,LS) if theme=='light' else (DB,DC,DP,DBR,DT,DS)
              return [[bg for _ in range(W)] for __ in range(H)],card,panel,border,text,sub
          def rect(p,x1,y1,x2,y2,c):
              x1=max(0,int(x1));y1=max(0,int(y1));x2=min(W,int(x2));y2=min(H,int(y2))
              for y in range(y1,y2):
                  for x in range(x1,x2): p[y][x]=c
          def line(p,x1,y1,x2,y2,c,w=1):
              if y1==y2: rect(p,x1,y1-w//2,x2+1,y1+(w+1)//2,c); return
              if x1==x2: rect(p,x1-w//2,y1,x1+(w+1)//2,y2+1,c); return
              steps=max(abs(x2-x1),abs(y2-y1))
              for i in range(steps+1):
                  x=round(x1+(x2-x1)*i/steps); y=round(y1+(y2-y1)*i/steps)
                  rect(p,x-w//2,y-w//2,x+(w+1)//2,y+(w+1)//2,c)
          def circle(p,cx,cy,r,c):
              rr=r*r
              for y in range(max(0,cy-r),min(H,cy+r+1)):
                  for x in range(max(0,cx-r),min(W,cx+r+1)):
                      if (x-cx)*(x-cx)+(y-cy)*(y-cy)<=rr: p[y][x]=c
          def box(p,x1,y1,x2,y2,fill,border):
              rect(p,x1,y1,x2,y2,fill); line(p,x1,y1,x2-1,y1,border); line(p,x1,y2-1,x2-1,y2-1,border); line(p,x1,y1,x1,y2-1,border); line(p,x2-1,y1,x2-1,y2-1,border)
          def header(p,border,text,width):
              line(p,14,48,W-15,48,border); rect(p,34,18,60,44,(255,255,255) if text==LT else DC)
              line(p,34,18,59,18,O,2); line(p,34,43,59,43,O,2); line(p,34,18,34,43,O,2); line(p,59,18,59,43,O,2)
              rect(p,42,26,52,36,O); rect(p,W-width-36,21,W-36,35,text)
          def pkg(p,x,y):
              rect(p,x+3,y+4,x+17,y+17,(219,191,147)); line(p,x+3,y+10,x+16,y+10,(235,216,181)); line(p,x+10,y+4,x+10,y+16,(235,216,181)); circle(p,x+3,y+4,3,(137,193,108))
          def van(p,x,y):
              white=(244,245,247); navy=(29,38,71); blue=(191,228,246)
              rect(p,x+25,y+22,x+110,y+61,white); rect(p,x+25,y+22,x+64,y+61,O); rect(p,x+110,y+35,x+140,y+61,white)
              line(p,x+110,y+22,x+140,y+35,white,10); rect(p,x+111,y+25,x+128,y+37,blue); rect(p,x+20,y+57,x+142,y+64,navy)
              for cx in (x+42,x+108):
                  circle(p,cx,y+61,15,navy); circle(p,cx,y+61,9,white)
          def make(widget,theme,path):
              p,card,panel,border,text,sub=canvas(theme); box(p,14,20,W-14,H-22,card,border)
              if widget=='mijn-post':
                  header(p,border,text,120); box(p,28,68,W-28,H-34,panel,border); cx=240
                  rect(p,cx-14,116,cx+14,136,panel); line(p,cx-14,116,cx+14,116,O,2); line(p,cx-14,136,cx+14,136,O,2); line(p,cx-14,116,cx-14,136,O,2); line(p,cx+14,116,cx+14,136,O,2); line(p,cx-14,116,cx,128,O,2); line(p,cx+14,116,cx,128,O,2)
                  rect(p,cx-56,146,cx+56,154,text); rect(p,cx-38,162,cx+38,168,sub); rect(p,cx-70,182,cx+70,188,sub)
              elif widget=='mijn-pakket':
                  header(p,border,text,154); y=64
                  for _ in range(3):
                      box(p,24,y,W-24,y+50,panel,border); pkg(p,38,y+14); rect(p,70,y+14,188,y+22,text); rect(p,70,y+28,150,y+34,sub); rect(p,W-138,y+13,W-44,y+35,(181,90,29) if theme=='dark' else (242,214,195)); circle(p,W-56,y+24,4,O); y+=56
              elif widget=='pakket-details':
                  header(p,border,text,146); box(p,24,58,W-24,H-30,panel,border); pkg(p,42,76); rect(p,72,77,148,85,text); rect(p,W-116,76,W-42,95,sub); rect(p,42,104,250,114,text); rect(p,42,120,160,126,sub); van(p,145,112)
                  y=210; line(p,46,y,W-46,y,sub,3); line(p,46,y,115,y,O,3); line(p,176,y-10,176,y+10,sub,2); line(p,305,y-10,305,y+10,sub,2); circle(p,115,y,10,O); circle(p,115,y,6,panel)
              else:
                  header(p,border,text,162); box(p,24,58,W-24,H-24,panel,border); pkg(p,42,74); rect(p,72,76,152,84,text); rect(p,72,92,220,100,text); x=62; line(p,x,116,x,210,O,3); circle(p,x,130,16,O); rect(p,x-5,125,x+5,135,(255,255,255)); rect(p,98,118,182,124,sub); rect(p,98,129,230,139,text)
                  for oy in (160,196):
                      circle(p,x,oy,11,O); line(p,x-4,oy,x,oy+5,(255,255,255),2); line(p,x,oy+5,x+6,oy-5,(255,255,255),2); rect(p,98,oy-8,170,oy-2,sub); rect(p,98,oy+3,250,oy+11,text)
              png(path,p)
          for w in ['mijn-post','mijn-pakket','pakket-details','pakket-reis']:
              for t in ['light','dark']:
                  make(w,t,Path('widgets')/w/f'preview-{t}.png')
          PY
      - name: Commit previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add widgets/*/preview-*.png
          git rm .github/workflows/apply123-previews.yml
          git commit -m "PostNL v1.2.3: refresh widget previews"
          git push origin main
