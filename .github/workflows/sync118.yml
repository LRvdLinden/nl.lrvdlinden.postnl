name: Sync PostNL v1.1.8 package

on:
  push:
    paths:
      - '.sync118/**'
      - '.github/workflows/sync118.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct v1.1.8 files
        shell: bash
        run: |
          set -euo pipefail
          cat .sync118/chunk*.txt > /tmp/diffs.b64
          base64 -d /tmp/diffs.b64 > /tmp/diffs.tar.gz
          tar -xzf /tmp/diffs.tar.gz -C .
          rm -f widgets/mijn-post/public/postnl-logo.png
          rm -rf .sync118
          rm -f .github/workflows/sync118.yml
      - name: Commit synchronized package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync full PostNL v1.1.8 package"
          git push
