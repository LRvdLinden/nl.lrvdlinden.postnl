name: Sync PostNL v1.2.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync120.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v1.2.0
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          for rel in ['package.json','package-lock.json','.homeycompose/app.json','app.json']:
              p=Path(rel)
              data=json.loads(p.read_text())
              data['version']='1.2.0'
              if rel=='package-lock.json' and data.get('packages',{}).get(''):
                  data['packages']['']['version']='1.2.0'
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')

          changelog=Path('.homeychangelog.json')
          data=json.loads(changelog.read_text())
          data['1.2.0']={
            'en':'Updated capability icons: the delivery window now uses the delivery icon and all parcel-related capabilities now use the new package icon provided.',
            'nl':'Capabiliteit-iconen bijgewerkt: het bezorgvenster gebruikt nu het delivery-icoon en alle pakketgerelateerde capabilities gebruiken nu het nieuwe package-icoon uit de bijlage.'
          }
          changelog.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')

          Path('assets/package.svg').write_text('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><path fill="none" stroke="#000" stroke-width="2" d="m4 9 12-6 12 6v15l-12 6L4 24zm0 0 12 6 12-6M16 15v15M10 6l12 6v6"/></svg>\n')
          Path('assets/delivery.svg').write_text('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#000" d="M3 4h11v10h2.18L18 9h3l2 3v5h-2a3 3 0 0 1-6 0H9a3 3 0 0 1-6 0H1V6c0-1.1.9-2 2-2Zm3 15a1 1 0 1 0 0-2 1 1 0 0 0 0 2Zm12 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2Zm0-8v3h3.2l-1-3H18Z"/></svg>\n')

          p=Path('.homeycompose/capabilities/postnl_delivery_window.json')
          data=json.loads(p.read_text())
          data['icon']='/assets/delivery.svg'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')

          package_caps=['postnl_package_count','postnl_package_status','postnl_package_sender','postnl_package_receiver','postnl_package_tracking','postnl_package_event','postnl_package_delivered','postnl_package_shipment_type']
          for name in package_caps:
              p=Path('.homeycompose/capabilities')/f'{name}.json'
              if p.exists():
                  data=json.loads(p.read_text())
                  data['icon']='/assets/package.svg'
                  p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')

          p=Path('app.json')
          data=json.loads(p.read_text())
          if 'postnl_delivery_window' in data.get('capabilities',{}):
              data['capabilities']['postnl_delivery_window']['icon']='/assets/delivery.svg'
          for name in package_caps:
              if name in data.get('capabilities',{}):
                  data['capabilities'][name]['icon']='/assets/package.svg'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')
          PY
      - name: Validate
        run: |
          python -m json.tool app.json >/dev/null
          python -m json.tool package.json >/dev/null
          python -m json.tool package-lock.json >/dev/null
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .homeycompose/app.json app.json .homeychangelog.json assets/package.svg assets/delivery.svg .homeycompose/capabilities
          git rm .github/workflows/sync120.yml
          git commit -m "PostNL v1.2.0: update capability icons"
          git push