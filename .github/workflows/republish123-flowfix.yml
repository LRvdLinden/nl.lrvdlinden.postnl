name: Republish PostNL v1.2.3 Flow compose fix
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/republish123-flowfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate
        run: |
          test "$(node -p "require('./package.json').version")" = "1.2.3"
          node --check drivers/account/driver.js
          node --check drivers/account/device.js
          python -m json.tool app.json >/dev/null
          python -m json.tool drivers/account/driver.flow.compose.json >/dev/null
      - name: Build release ZIP
        run: |
          mkdir -p /tmp/release/PostNL-for-Homey-v1.2.3
          rsync -a ./ /tmp/release/PostNL-for-Homey-v1.2.3/ --exclude '.git' --exclude '.github'
          cd /tmp/release
          zip -qr "$GITHUB_WORKSPACE/PostNL-for-Homey-v1.2.3.zip" PostNL-for-Homey-v1.2.3
      - name: Update v1.2.3 tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 408750859e877715b8144fbaa01e6ae4cd6d1bea
        run: |
          git tag -f v1.2.3 "$RELEASE_SHA"
          git push origin -f refs/tags/v1.2.3
          gh release upload v1.2.3 PostNL-for-Homey-v1.2.3.zip --clobber
          gh release edit v1.2.3 --notes "Added new device Flow triggers and conditions, restored the v1.2.2 widget previews, updated the developer website, and fixed the Homey Compose Flow definitions so all new cards are included in generated app metadata."
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/republish123-flowfix.yml
          git commit -m "Remove temporary v1.2.3 Flow fix publish workflow"
          git push origin main
