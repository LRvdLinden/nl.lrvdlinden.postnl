name: Apply PostNL v1.2.6 sync
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply126-sync.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild v1.2.6 source from clean v1.2.5 baseline
        run: |
          cat .sync/patch0.b64 .sync/patch1.b64 .sync/patch2.b64 .sync/patch3.b64 .sync/patch4.b64 | base64 -d | gzip -dc > /tmp/postnl126.patch
          git worktree add /tmp/postnl125 v1.2.5
          cd /tmp/postnl125
          git apply --check /tmp/postnl126.patch
          git apply /tmp/postnl126.patch
          cd "$GITHUB_WORKSPACE"
          rsync -a /tmp/postnl125/ ./             --exclude '.git'             --exclude '*.png'             --exclude '*.gif'             --exclude 'package.json'             --exclude 'package-lock.json'             --exclude '.homeycompose/app.json'
          rm -rf widgets/reis-pakket
          rm -f drivers/account/pair/repair_login.html
          rm -f .github/workflows/clean121.yml .github/workflows/publish-v1.2.1-final.yml .github/workflows/rebuild121-clean.yml
          rm -f .sync/part05 .sync/part06 .sync/part07 .sync/part08 .sync/part09 .sync/part10
          rm -f .sync/patch0.b64 .sync/patch1.b64 .sync/patch2.b64 .sync/patch3.b64 .sync/patch4.b64
          rm -f .github/workflows/apply126-sync.yml
      - name: Validate
        run: |
          test "$(node -p "require('./package.json').version")" = "1.2.6"
          test "$(node -p "require('./app.json').version")" = "1.2.6"
          node --check drivers/account/driver.js
          node --check drivers/account/device.js
          node --check lib/postnl-api.js
          python -m json.tool app.json >/dev/null
          python -m json.tool drivers/account/driver.flow.compose.json >/dev/null
          test -f drivers/account/repair/repair_login.html
          test ! -e widgets/reis-pakket
          grep -q 'type.*dropdown' drivers/account/driver.flow.compose.json
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PostNL v1.2.6: sync latest device, flows and widgets"
          git push origin HEAD:main
