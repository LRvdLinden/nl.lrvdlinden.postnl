name: Publish PostNL v1.2.4
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish124.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate
        run: |
          test "$(node -p "require('./package.json').version")" = "1.2.4"
          node --check drivers/account/driver.js
          node --check drivers/account/device.js
          python -m json.tool app.json >/dev/null
          python -m json.tool drivers/account/driver.flow.compose.json >/dev/null
      - name: Build release ZIP
        run: |
          mkdir -p /tmp/release/PostNL-for-Homey-v1.2.4
          rsync -a ./ /tmp/release/PostNL-for-Homey-v1.2.4/ --exclude '.git' --exclude '.github'
          cd /tmp/release
          zip -qr "$GITHUB_WORKSPACE/PostNL-for-Homey-v1.2.4.zip" PostNL-for-Homey-v1.2.4
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.4 PostNL-for-Homey-v1.2.4.zip --target "${GITHUB_SHA}" --title "PostNL v1.2.4" --notes "Flow card definitions are now fully included in Homey Compose. Added the new parcel triggers and conditions while retaining the v1.2.2 widget previews."
