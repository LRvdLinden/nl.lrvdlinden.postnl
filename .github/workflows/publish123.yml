name: Publish PostNL v1.2.3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish123.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate
        run: |
          test "$(node -p "require('./package.json').version")" = "1.2.3"
          python -m json.tool app.json >/dev/null
      - name: Build release ZIP
        run: |
          mkdir -p /tmp/release/PostNL-for-Homey-v1.2.3
          rsync -a ./ /tmp/release/PostNL-for-Homey-v1.2.3/ --exclude '.git' --exclude '.github'
          cd /tmp/release
          zip -qr "$GITHUB_WORKSPACE/PostNL-for-Homey-v1.2.3.zip" PostNL-for-Homey-v1.2.3
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.3 PostNL-for-Homey-v1.2.3.zip --title "PostNL v1.2.3" --notes "Updated widget preview images to better match the actual widgets while following Homey preview requirements, and updated the developer website URL."
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish123.yml
          git commit -m "Remove temporary v1.2.3 publish workflow"
          git push origin main
