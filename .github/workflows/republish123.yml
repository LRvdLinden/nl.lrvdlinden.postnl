name: Republish PostNL v1.2.3
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/republish123.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate
        run: |
          test "$(node -p "require('./package.json').version")" = "1.2.3"
          node --check drivers/account/driver.js
          node --check drivers/account/device.js
          python -m json.tool app.json >/dev/null
      - name: Build release ZIP
        run: |
          mkdir -p /tmp/release/PostNL-for-Homey-v1.2.3
          rsync -a ./ /tmp/release/PostNL-for-Homey-v1.2.3/ --exclude '.git' --exclude '.github'
          cd /tmp/release
          zip -qr "$GITHUB_WORKSPACE/PostNL-for-Homey-v1.2.3.zip" PostNL-for-Homey-v1.2.3
      - name: Update v1.2.3 tag and release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 2e14afa077ad88b860c54abc44f023c57cdab84a
        run: |
          git tag -f v1.2.3 "$RELEASE_SHA"
          git push origin -f refs/tags/v1.2.3
          gh release upload v1.2.3 PostNL-for-Homey-v1.2.3.zip --clobber
          gh release edit v1.2.3 --title "PostNL v1.2.3" --notes "Added new device Flow triggers for parcel delivered, changed delivery window, new PostNL parcel event, weight available and dimensions available. Added new Flow conditions for connection, weight, dimensions and current parcel status. Restored the v1.2.2 widget previews."
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/republish123.yml
          git commit -m "Remove temporary v1.2.3 republish workflow"
          git push origin main
