name: Apply PostNL v1.2.3 metadata
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply123-text.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update version, homepage and changelog
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          for rel in ['package.json','package-lock.json','app.json','.homeycompose/app.json']:
              p=Path(rel)
              d=json.loads(p.read_text())
              d['version']='1.2.3'
              if rel in ['app.json','.homeycompose/app.json']:
                  d['homepage']='https://lrvdlinden.gitbook.io/postnl-for-homey'
              if rel=='package-lock.json' and d.get('packages',{}).get('') is not None:
                  d['packages']['']['version']='1.2.3'
              p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+'\n')
          p=Path('.homeychangelog.json')
          d=json.loads(p.read_text())
          d['1.2.3']={
            'en':'Updated the widget preview images so they better match the actual widgets while still following Homey preview guidelines without recognizable text. Updated the app homepage in app.json to the PostNL for Homey developer website.',
            'nl':'De previewafbeeldingen van de widgets zijn vernieuwd zodat ze beter aansluiten op de echte widgets en tegelijk voldoen aan de Homey-richtlijnen zonder herkenbare tekst. Daarnaast is de homepage in app.json bijgewerkt naar de PostNL for Homey developer website.'
          }
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+'\n')
          PY
      - name: Commit
        run: |
          python -m json.tool app.json >/dev/null
          test "$(node -p "require('./package.json').version")" = "1.2.3"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .homeychangelog.json .homeycompose/app.json app.json package.json package-lock.json
          git rm .github/workflows/apply123-text.yml
          git commit -m "PostNL v1.2.3: developer website metadata"
          git push origin main
