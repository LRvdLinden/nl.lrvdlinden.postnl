name: Publish PostNL v1.2.5
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish125.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate
        run: |
          test "$(node -p "require('./package.json').version")" = "1.2.5"
          node --check drivers/account/driver.js
          node --check drivers/account/device.js
          python -m json.tool app.json >/dev/null
          python -m json.tool drivers/account/driver.flow.compose.json >/dev/null
      - name: Build release ZIP
        run: |
          mkdir -p /tmp/release/PostNL-for-Homey-v1.2.5
          rsync -a ./ /tmp/release/PostNL-for-Homey-v1.2.5/ --exclude '.git' --exclude '.github'
          cd /tmp/release
          zip -qr "$GITHUB_WORKSPACE/PostNL-for-Homey-v1.2.5.zip" PostNL-for-Homey-v1.2.5
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.5 PostNL-for-Homey-v1.2.5.zip --target "${GITHUB_SHA}" --title "PostNL v1.2.5" --notes "All condition Flow cards now support Homey's inverted condition state. The current parcel status condition uses titleFormatted so the selected status is rendered correctly instead of showing [[status]]."
