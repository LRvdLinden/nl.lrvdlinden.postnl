name: Release PostNL v1.2.4
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release124.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set v1.2.4
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          for rel in ['package.json','package-lock.json','app.json','.homeycompose/app.json']:
              p=Path(rel)
              d=json.loads(p.read_text())
              d['version']='1.2.4'
              if rel=='package-lock.json' and d.get('packages',{}).get('') is not None:
                  d['packages']['']['version']='1.2.4'
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          p=Path('.homeychangelog.json')
          d=json.loads(p.read_text())
          d['1.2.4']={
            'en':'Flow card definitions are now fully included in Homey Compose. Added parcel delivered, delivery window changed, new PostNL parcel event, parcel weight available and parcel dimensions available triggers, plus conditions for connection, parcel weight, parcel dimensions and current parcel status. Keeps the v1.2.2 widget previews.',
            'nl':'De nieuwe Flow-kaarten zijn nu volledig opgenomen in Homey Compose. Triggers toegevoegd voor pakket bezorgd, bezorgvenster gewijzigd, nieuwe PostNL-pakketgebeurtenis, pakketgewicht bekend en pakketafmetingen bekend, plus voorwaarden voor verbinding, pakketgewicht, pakketafmetingen en huidige pakketstatus. De widget-previews van v1.2.2 blijven behouden.'
          }
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate and commit v1.2.4
        run: |
          test "$(node -p "require('./package.json').version")" = "1.2.4"
          node --check drivers/account/driver.js
          node --check drivers/account/device.js
          python -m json.tool app.json >/dev/null
          python -m json.tool drivers/account/driver.flow.compose.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json app.json .homeycompose/app.json .homeychangelog.json
          git commit -m "PostNL v1.2.4: publish complete Flow cards"
          git push origin main
      - name: Build release ZIP from committed state
        run: |
          git fetch origin main
          git reset --hard origin/main
          mkdir -p /tmp/release/PostNL-for-Homey-v1.2.4
          rsync -a ./ /tmp/release/PostNL-for-Homey-v1.2.4/ --exclude '.git' --exclude '.github'
          cd /tmp/release
          zip -qr "$GITHUB_WORKSPACE/PostNL-for-Homey-v1.2.4.zip" PostNL-for-Homey-v1.2.4
      - name: Publish v1.2.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse HEAD)"
          git tag -f v1.2.4 "$SHA"
          git push origin -f refs/tags/v1.2.4
          gh release create v1.2.4 PostNL-for-Homey-v1.2.4.zip --title "PostNL v1.2.4" --notes "Flow card definitions are now fully included in Homey Compose. Added new parcel triggers and conditions, while keeping the v1.2.2 widget previews."
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release124.yml
          git commit -m "Remove temporary v1.2.4 release workflow"
          git push origin main
