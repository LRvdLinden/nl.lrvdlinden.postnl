name: Sync PostNL v1.2.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync122.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v1.2.2 fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          for rel in ['package.json','package-lock.json','.homeycompose/app.json','app.json']:
              p=Path(rel)
              d=json.loads(p.read_text())
              d['version']='1.2.2'
              if rel=='package-lock.json' and d.get('packages',{}).get('') is not None:
                  d['packages']['']['version']='1.2.2'
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')

          p=Path('widgets/mijn-pakket/api.js')
          s=p.read_text()
          needle="function str(...values){for(const value of values){if(value===0)return'0';if(value!==undefined&&value!==null&&String(value).trim())return String(value).trim();}return'';}\n"
          helper="function shipmentType(homey,value){const raw=str(value);if(!raw)return'';return homey.i18n.getLanguage()==='nl'&&/^parcel$/i.test(raw)?'Pakket':raw;}\n"
          if helper not in s:
              s=s.replace(needle,needle+helper)
          s=s.replace('shipmentType:str(parcel.shipmentType)', 'shipmentType:shipmentType(homey,parcel.shipmentType)')
          p.write_text(s)

          p=Path('.homeychangelog.json')
          d=json.loads(p.read_text())
          d['1.2.2']={
            'en':'Fixed My Packages widget crash caused by the shipment type formatter not being defined.',
            'nl':'Crash in de Mijn Pakketten-widget opgelost waarbij de formatter voor het zendingstype niet was gedefinieerd.'
          }
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate and commit
        run: |
          node --check widgets/mijn-pakket/api.js
          python -m json.tool app.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .homeycompose/app.json app.json .homeychangelog.json widgets/mijn-pakket/api.js
          git rm .github/workflows/sync122.yml
          git commit -m "PostNL v1.2.2: fix My Packages shipment type crash"
          git push