<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;justify-content:center;margin:12px 0 20px}.logo img{width:92px;height:92px}.hint{opacity:.68;font-size:12px;line-height:1.45;margin-top:12px}.spacer{height:10px}</style></head><body><div class="logo"><img src="../../../assets/icon.svg" alt="PostNL"></div><h1 class="homey-title" id="title">PostNL-account koppelen</h1><p class="homey-subtitle" id="subtitle">Log rechtstreeks in met dezelfde gegevens als op jouw.postnl.nl.</p><div class="homey-form-group"><label class="homey-form-label" id="emailLabel" for="email">E-mailadres</label><input id="email" class="homey-form-input" type="email" autocomplete="username" autocapitalize="none"></div><div class="spacer"></div><div class="homey-form-group"><label class="homey-form-label" id="passwordLabel" for="password">Wachtwoord</label><input id="password" class="homey-form-input" type="password" autocomplete="current-password"></div><div class="spacer"></div><button id="connect" class="homey-button-primary-full" type="button">Koppelen</button><p class="hint" id="hint">Je wachtwoord wordt alleen gebruikt om bij PostNL in te loggen. Homey bewaart daarna de verkregen tokens, niet je wachtwoord.</p><script>const isNl=(Homey.__('pair.language_marker')||'nl')==='nl';const $=id=>document.getElementById(id);if(!isNl){$('title').textContent='Connect PostNL account';$('subtitle').textContent='Sign in directly with the same credentials you use on jouw.postnl.nl.';$('emailLabel').textContent='Email address';$('passwordLabel').textContent='Password';$('connect').textContent='Connect';$('hint').textContent='Your password is only used to sign in to PostNL. Homey stores the resulting tokens, not your password.';}$('connect').addEventListener('click',async()=>{const username=$('email').value.trim(),password=$('password').value;if(!username||!password){Homey.alert(isNl?'Vul je e-mailadres en wachtwoord in.':'Enter your email address and password.');return;}$('connect').disabled=true;try{const result=await Homey.emit('login_credentials',{username,password});await Homey.createDevice(result.device);Homey.done();}catch(e){Homey.alert(e.message||String(e));$('connect').disabled=false;}});</script></body></html>
