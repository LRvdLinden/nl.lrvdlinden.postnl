<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light dark;--orange:#FB6200;--primary:#232323;--secondary:#747378;--muted:#97969b;--bg:#f4f4f5;--header:#fafafa;--border:#dedee0;--panel:#fff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--primary);font:14px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{height:100%;display:grid;grid-template-rows:52px minmax(0,1fr);border-radius:17px;overflow:hidden;background:var(--bg)}header{display:flex;align-items:center;padding:0 18px;background:var(--header);border-bottom:1px solid var(--border)}header img{width:36px;height:36px}h1{margin:0 0 0 auto;color:#77767b;font-size:18px;font-weight:600;white-space:nowrap}.body{min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior-y:contain;padding:15px 16px 18px;scrollbar-gutter:stable}.summary{padding:0 2px 13px;border-bottom:1px solid var(--border)}.sender{font-size:16px;font-weight:800}.tracking,.physical{color:var(--secondary);font-size:11px;margin-top:3px}.status{display:flex;align-items:flex-start;gap:9px;font-size:18px;font-weight:850;margin-top:8px;overflow-wrap:anywhere}.current{flex:none;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#fff;font-size:14px}.journey{position:relative;padding:13px 0 0 42px}.journey:before{content:"";position:absolute;left:17px;top:24px;bottom:18px;width:3px;background:var(--orange)}.event{position:relative;padding:0 0 18px;min-height:55px}.dot{position:absolute;left:-39px;top:2px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#fff;font-size:17px;font-weight:900}.when{font-weight:750;font-size:12px}.msg{font-size:14px;margin-top:4px;overflow-wrap:anywhere}.location{font-size:11px;color:var(--secondary);margin-top:3px}.state{height:100%;display:grid;place-items:center;text-align:center;padding:25px;color:var(--muted)}.state img{width:min(88%,290px);max-height:170px;margin-bottom:14px}.state strong{display:block;font-size:17px;color:inherit;font-weight:700}@media(prefers-color-scheme:dark){:root{--primary:#f4f4f5;--secondary:#c4c3c7;--muted:#aaa9ad;--bg:#202022;--header:#29292b;--border:#424244;--panel:#343436}h1{color:#aaa9ad}.state{color:#aaa9ad}}</style></head><body><main class="card"><header><img src="icon.svg"><h1 id="title">Reis van je pakket</h1></header><section id="body" class="body"><div class="state">Pakketreis ophalen…</div></section></main><script>const t={nl:{title:'Reis van je pakket',loading:'Pakketreis ophalen…',empty:'Er is momenteel geen pakketreis.',tracking:'Tracking',weight:'Gewicht',dimensions:'Afmetingen',login:'Koppel eerst je PostNL-account.'},en:{title:'Parcel Journey',loading:'Loading parcel journey…',empty:'There is currently no parcel journey.',tracking:'Tracking',weight:'Weight',dimensions:'Dimensions',login:'Connect your PostNL account first.'}};function L(v){return String(v||'en').split('-')[0]==='nl'?'nl':'en'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function fmt(v,locale,tz){const d=new Date(v);if(Number.isNaN(d.getTime()))return String(v||'');try{return new Intl.DateTimeFormat(locale==='nl'?'nl-NL':'en-GB',{timeZone:tz,day:'2-digit',month:'long',hour:'2-digit',minute:'2-digit'}).format(d)}catch(_){return String(v||'')}}function norm(v){return String(v||'').trim().toLocaleLowerCase()}function onHomeyReady(Homey){const body=document.getElementById('body'),title=document.getElementById('title');let id=(Homey.getDeviceIds()||[])[0]||'';async function get(){return Homey.api('GET','/?deviceId='+encodeURIComponent(id),{})}function render(x){const lang=L(x.locale),w=t[lang];title.textContent=w.title;if(!x.authenticated){body.innerHTML='<div class="state">'+esc(w.login)+'</div>';return}const p=x.parcel;if(!p){body.innerHTML='<div class="state"><div><img src="van-1.svg"><strong>'+esc(w.empty)+'</strong></div></div>';return}const physical=[p.weight?w.weight+': '+p.weight:'',p.dimensions?w.dimensions+': '+p.dimensions:''].filter(Boolean).join(' · ');let events=[...(p.events||[])].sort((a,b)=>(Date.parse(b.timestamp||'')||0)-(Date.parse(a.timestamp||'')||0));const current=norm(p.status);if(events.length&&current&&norm(events[0].description)===current)events=events.slice(1);let h='<section class="summary"><div class="sender">'+esc(p.sender||'PostNL')+'</div><div class="tracking">'+esc(w.tracking)+': '+esc(p.tracking)+'</div>'+(physical?'<div class="physical">'+esc(physical)+'</div>':'')+'<div class="status"><span class="current">▣</span><span>'+esc(p.status||'')+'</span></div></section>';h+='<div class="journey">'+events.map(e=>'<article class="event"><span class="dot">✓</span><div class="when">'+esc(fmt(e.timestamp,x.locale,x.timeZone))+'</div><div class="msg">'+esc(e.description||'')+'</div>'+(e.location?'<div class="location">'+esc(e.location)+'</div>':'')+'</article>').join('')+'</div>';body.innerHTML=h}async function load(show=true){if(show)body.innerHTML='<div class="state">'+t.nl.loading+'</div>';try{render(await get())}catch(e){body.innerHTML='<div class="state">'+esc(e.message||e)+'</div>'}}async function refresh(){await load(false)}(async()=>{await load(true);Homey.ready();setInterval(refresh,60000)})()}</script></body></html>
