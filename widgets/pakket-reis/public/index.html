<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light dark;--orange:#e95a22;--bg:#f4f4f5;--panel:#fff;--primary:#191928;--secondary:#6f7079;--line:#e1e1e5}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font:14px/1.3 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--primary)}.card{height:100%;border-radius:17px;overflow:hidden;background:var(--bg);display:grid;grid-template-rows:52px 1fr}header{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}header img{width:34px;height:34px;object-fit:contain}h1{margin:0 0 0 auto;font-size:17px;color:var(--secondary)}#c{overflow:auto;padding:15px;background:var(--panel)}.hero{padding:0 0 12px 46px;border-bottom:1px solid var(--line)}.sender{font-size:17px;font-weight:800}.status{margin-top:3px;font-size:20px;font-weight:800;line-height:1.18}.track{margin-top:5px;color:var(--secondary);font-size:11px}.facts{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.fact{padding:4px 8px;border-radius:10px;background:#fff0e8;color:#8d3a13;font-size:11px;font-weight:700}.journey{position:relative;padding:12px 0 0 46px}.journey:before{content:"";position:absolute;left:19px;top:18px;bottom:15px;width:3px;background:var(--orange)}.event{position:relative;padding:0 0 18px}.dot{position:absolute;left:-39px;top:2px;width:23px;height:23px;border-radius:50%;background:var(--orange);display:grid;place-items:center;color:white;font-weight:900}.event:first-child .dot{width:34px;height:34px;left:-45px;top:-3px}.event:first-child .msg{font-size:17px;font-weight:800}.when{font-weight:750;font-size:12px}.msg{margin-top:3px;font-size:14px}.loc{margin-top:2px;color:var(--secondary);font-size:11px}.state{height:100%;display:grid;place-items:center;text-align:center;padding:25px;color:var(--secondary)}.state img{display:block;width:84px;margin:0 auto 13px}.state strong{display:block;font-size:17px;color:var(--primary)}@media(prefers-color-scheme:dark){:root{--bg:#202022;--panel:#2e2e30;--primary:#f7f7f8;--secondary:#c2c2c7;--line:#454548}.fact{background:#55321f;color:#ffd2b3}}</style></head><body><main class="card"><header><img src="icon.svg" alt="PostNL"><h1 id="title">Reis van je pakket</h1></header><section id="c"><div class="state">Reis ophalen…</div></section></main><script>const I={nl:{title:'Reis van je pakket',empty:'Er is momenteel geen pakketreis',emptySub:'Zodra er een pakket onderweg is, verschijnt de reis hier.',tracking:'Tracking',weight:'Gewicht',dimensions:'Afmetingen'},en:{title:'Parcel Journey',empty:'There is currently no parcel journey',emptySub:'As soon as a parcel is on its way, its journey appears here.',tracking:'Tracking',weight:'Weight',dimensions:'Dimensions'}};let H,L,TZ;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function lang(v){return String(v||'en').split('-')[0]==='nl'?'nl':'en'}function dt(v){if(!v)return'';const d=new Date(v);if(Number.isNaN(d.getTime()))return String(v);try{return new Intl.DateTimeFormat(L==='nl'?'nl-NL':'en-GB',{timeZone:TZ,day:'2-digit',month:'long',hour:'2-digit',minute:'2-digit'}).format(d)}catch(_){return String(v)}}function render(x){const c=document.getElementById('c');if(!x.parcel){c.innerHTML=`<div class="state"><div><img src="package.svg"><strong>${esc(I[L].empty)}</strong><div>${esc(I[L].emptySub)}</div></div></div>`;return}const p=x.parcel;let events=[...(p.events||[])].filter(e=>e.description||e.timestamp).sort((a,b)=>(Date.parse(b.timestamp||'')||0)-(Date.parse(a.timestamp||'')||0));if(!events.length)events=[{description:p.status,timestamp:''}];const facts=[];if(p.weight)facts.push(`<span class="fact">${esc(I[L].weight)}: ${esc(p.weight)}</span>`);if(p.dimensions)facts.push(`<span class="fact">${esc(I[L].dimensions)}: ${esc(p.dimensions)}</span>`);c.innerHTML=`<div class="hero"><div class="sender">${esc(p.sender||'PostNL')}</div><div class="status">${esc(p.status||events[0]?.description||'')}</div><div class="track">${esc(I[L].tracking)}: ${esc(p.tracking||'')}</div><div class="facts">${facts.join('')}</div></div><div class="journey">${events.map((e,i)=>`<div class="event"><span class="dot">${i===0?'▣':'✓'}</span><div class="when">${esc(dt(e.timestamp))}</div><div class="msg">${esc(e.description)}</div>${e.location?`<div class="loc">${esc(e.location)}</div>`:''}</div>`).join('')}</div>`}async function load(){const ids=H.getDeviceIds(),id=ids[0]||'';const x=await H.api('GET','/?deviceId='+encodeURIComponent(id),{});L=lang(x.locale);TZ=x.timeZone||'UTC';document.getElementById('title').textContent=I[L].title;render(x);return id}async function onHomeyReady(Homey){H=Homey;try{const id=await load();Homey.ready();Homey.api('POST','/sync',{deviceId:id}).then(load).catch(()=>{})}catch(e){document.getElementById('c').innerHTML=`<div class="state">${esc(e.message||e)}</div>`;Homey.ready()}}</script></body></html>
