<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark;--brand:#FB6200;--brand-soft:#fff0e6;--card:#f4f4f5;--header:#fafafa;--border:#dedee0;--row:#fff;--carrier:#fff4ec;--primary:#232323;--secondary:#747378;--muted:#97969b;--title:#77767b;--pill:#fff0e6;--pill-text:#9a3f00;--dialog:#fff;--stat:#fff6f0}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color:var(--primary);font:14px/1.28 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}
.card{display:grid;grid-template-rows:52px minmax(0,1fr);height:100%;border-radius:17px;overflow:hidden;background:var(--card)}header{display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--border);background:var(--header)}.app{width:36px;height:36px;object-fit:contain}h1{margin:0 0 0 auto;color:var(--title);font-size:18px;font-weight:600;white-space:nowrap}#c{overflow-y:auto;padding:10px 12px}.list{display:grid;gap:8px}
.p{display:grid;width:100%;grid-template-columns:54px minmax(0,1fr) minmax(90px,130px);gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:11px;background:var(--row);color:var(--primary);text-align:start;cursor:pointer}.p:active{transform:scale(.992)}.carrier{display:grid;place-items:center;width:54px;height:42px;border-radius:9px;background:var(--carrier)}.carrier img{display:block;max-width:42px;max-height:30px;object-fit:contain}.meta{min-width:0}.sender{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.carriername,.detail{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--secondary);font-size:12px}.detail{font-size:11px;color:var(--muted)}.badge{display:block;max-width:130px;padding:6px 8px;border-radius:14px;background:var(--pill);color:var(--pill-text);font-size:10px;line-height:1.18;font-weight:800;text-align:center;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;word-break:normal}.state{display:grid;place-items:center;height:100%;padding:20px;text-align:center;color:var(--title)}
.modal{position:fixed;inset:0;z-index:9999;display:none;place-items:center;padding:18px;background:#000c}.modal.open{display:grid}.dialog{position:relative;width:min(350px,100%);max-height:calc(100vh - 28px);overflow:auto;border-radius:24px;background:var(--dialog);color:var(--primary);box-shadow:0 18px 50px #0004}.close{position:absolute;top:10px;inset-inline-end:10px;z-index:2;display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:50%;background:#ffffffde;color:#4b2b18;font-size:22px;cursor:pointer}.popup-hero{display:flex;align-items:center;gap:14px;padding:19px 54px 16px 18px;background:linear-gradient(140deg,#ffe4d0,#fff9f5)}.popup-logo{display:grid;place-items:center;flex:0 0 auto;width:72px;height:64px;border-radius:18px;background:#fff;box-shadow:0 0 0 4px #fff7f1,0 4px 14px #7a2f001c}.popup-logo img{display:block;max-width:58px;max-height:40px;object-fit:contain}.identity{min-width:0}.popup-name{display:block;font-size:20px;line-height:1.15;overflow-wrap:anywhere}.carrier-chip{display:inline-block;margin-top:7px;padding:3px 9px;border-radius:20px;background:#fff;color:var(--brand);font-size:11px;font-weight:750}.popup-status{padding:14px 18px 10px}.status-label{display:block;margin-bottom:4px;color:var(--brand);font-size:10px;font-weight:800;text-transform:uppercase}.status-value{margin:0;font-size:17px;font-weight:800;overflow-wrap:anywhere}.tracking-sub{margin:5px 0 0;color:var(--secondary);font-size:12px;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 18px 10px}.stat{min-width:0;padding:9px 11px;border-radius:13px;background:var(--stat)}.stat span,.detail-label{display:block;color:var(--secondary);font-size:10px}.stat strong{display:block;margin-top:3px;font-size:15px;overflow-wrap:anywhere}.detail-list{display:grid;padding:0 18px 8px}.detail-row{display:grid;grid-template-columns:minmax(92px,38%) minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--border)}.detail-value{min-width:0;font-size:12px;font-weight:650;overflow-wrap:anywhere;text-align:end}
@media(prefers-color-scheme:dark){:root{--card:#202022;--header:#29292b;--border:#424244;--row:#343436;--carrier:#3a2a20;--primary:#f4f4f5;--secondary:#c4c3c7;--muted:#aaa9ad;--title:#d3d2d5;--pill:#5a341d;--pill-text:#ffd2b3;--dialog:#292b2a;--stat:#3a302a}.popup-hero{background:linear-gradient(140deg,#5a321b,#342a25)}.popup-logo{background:#f7f7f7;box-shadow:0 0 0 4px #694028}.carrier-chip{background:#51321f;color:#ffbf91}.status-label{color:#ffad73}.close{background:#4a3b33;color:#fff}}
</style></head><body>
<main class="card"><header><img class="app" src="icon.svg" alt="PostNL"><h1 id="title">Mijn Pakketten</h1></header><section id="c"><div class="state">Pakketten ophalen…</div></section></main>
<div id="modal" class="modal" role="dialog" aria-modal="true"><section id="dialog" class="dialog"><button id="close" class="close" type="button" aria-label="Sluiten">×</button><div id="dialogContent"></div></section></div>
<script>
const i18n={en:{title:'My Packages',loading:'Loading packages…',empty:'No recent packages.',login:'Connect your PostNL account first.',status:'Status',sender:'Sender',tracking:'Tracking number',deliveryDate:'Delivery date',deliveryWindow:'Delivery window',updated:'Last update',account:'Account',receiver:'Receiver',shipmentType:'Shipment type',addressType:'Delivery address type',direction:'Direction',sharedFrom:'Shared from',lastEvent:'Last event',weight:'Weight',dimensions:'Dimensions',close:'Close'},nl:{title:'Mijn Pakketten',loading:'Pakketten ophalen…',empty:'Geen recente pakketten.',login:'Koppel eerst je PostNL-account.',status:'Status',sender:'Afzender',tracking:'Trackingnummer',deliveryDate:'Bezorgdatum',deliveryWindow:'Bezorgvenster',updated:'Laatste update',account:'Account',receiver:'Ontvanger',shipmentType:'Type zending',addressType:'Type bezorgadres',direction:'Richting',sharedFrom:'Gedeeld via',lastEvent:'Laatste gebeurtenis',weight:'Gewicht',dimensions:'Afmetingen',close:'Sluiten'}};
function L(v){return String(v||'en').split('-')[0]==='nl'?'nl':'en'}function text(v){return String(v??'').trim()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function dateDMY(value,tz){const raw=text(value);if(!raw)return'';let m=raw.match(/^(\d{4})-(\d{2})-(\d{2})(?:$|[T\s])/);const zoned=/(?:Z|[+-]\d{2}:?\d{2})$/i.test(raw);if(m&&!zoned)return`${m[3]}-${m[2]}-${m[1]}`;const d=new Date(raw);if(Number.isNaN(d.getTime()))return raw;try{const p=new Intl.DateTimeFormat('en-GB',{timeZone:tz,day:'2-digit',month:'2-digit',year:'numeric'}).formatToParts(d),g=t=>p.find(x=>x.type===t)?.value||'';return`${g('day')}-${g('month')}-${g('year')}`}catch(_){return raw}}
function timeHM(value,tz){const raw=text(value);if(!raw)return'';const zoned=/(?:Z|[+-]\d{2}:?\d{2})$/i.test(raw);if(!zoned){const m=raw.match(/(?:T|\s)(\d{2}:\d{2})(?::\d{2})?/);if(m)return m[1]}const d=new Date(raw);if(!Number.isNaN(d.getTime()))try{return new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}catch(_){}return''}
function dateTime(value,locale,tz){if(!value)return'';const d=new Date(value);if(Number.isNaN(d.getTime()))return text(value);try{return new Intl.DateTimeFormat(locale,{timeZone:tz,dateStyle:'short',timeStyle:'short'}).format(d)}catch(_){return text(value)}}
function onHomeyReady(Homey){const c=document.getElementById('c'),title=document.getElementById('title'),modal=document.getElementById('modal'),dialog=document.getElementById('dialog'),dc=document.getElementById('dialogContent'),close=document.getElementById('close');let cfg={locale:'en',timeZone:'UTC'},labels=i18n.en,packages=[];const el=(t,cl,v)=>{const n=document.createElement(t);if(cl)n.className=cl;if(v!==undefined)n.textContent=v;return n};function detailRow(list,label,value){value=text(value);if(!value)return;const row=el('div','detail-row');row.append(el('span','detail-label',label),el('strong','detail-value',value));list.append(row)}function stat(label,value){value=text(value);if(!value)return null;const n=el('div','stat');n.append(el('span','',label),el('strong','',value));return n}function closePopup(){modal.classList.remove('open');dc.replaceChildren()}
function openPopup(p){try{Homey.hapticFeedback?.()}catch(_){}close.setAttribute('aria-label',labels.close);const hero=el('div','popup-hero'),logo=el('div','popup-logo'),img=document.createElement('img');img.src='icon.svg';img.alt='PostNL';logo.append(img);hero.append(logo);const identity=el('div','identity'),name=text(p.sender||p.title||p.tracking||'PostNL');identity.append(el('strong','popup-name',name),el('span','carrier-chip','PostNL'));hero.append(identity);const st=el('div','popup-status');st.append(el('span','status-label',labels.status),el('p','status-value',text(p.status)||'—'));if(p.tracking)st.append(el('p','tracking-sub',`${labels.tracking}: ${p.tracking}`));const stats=el('div','stats');const dd=dateDMY(p.deliveryDate||p.deliveryWindowFrom||p.eventAt||p.updatedAt,cfg.timeZone),dw=text(p.deliveryWindow);const sd=stat(labels.deliveryDate,dd),sw=stat(labels.deliveryWindow,dw);if(sd)stats.append(sd);if(sw)stats.append(sw);const list=el('div','detail-list');detailRow(list,labels.sender,p.sender);detailRow(list,labels.receiver,p.receiver);detailRow(list,labels.account,p.account);detailRow(list,labels.shipmentType,p.shipmentType);detailRow(list,labels.addressType,p.deliveryAddressType);detailRow(list,labels.direction,p.direction);detailRow(list,labels.sharedFrom,p.sharedFrom);detailRow(list,labels.weight,p.weight);detailRow(list,labels.dimensions,p.dimensions);detailRow(list,labels.lastEvent,p.lastEvent||p.status);detailRow(list,labels.updated,dateTime(p.updatedAt,cfg.locale,cfg.timeZone));dc.replaceChildren(hero,st);if(stats.children.length)dc.append(stats);if(list.children.length)dc.append(list);dialog.scrollTop=0;modal.classList.add('open')}
function rowSummary(p){const window=text(p.deliveryWindow),deliveryDay=dateDMY(p.deliveryDate||p.deliveryWindowFrom||p.updatedAt,cfg.timeZone),eventValue=p.lastEventAt||p.eventAt||(p.delivered?p.deliveryDate:'')||p.updatedAt||p.createdAt||p.deliveryDate,eventDay=dateDMY(eventValue||p.deliveryDate,cfg.timeZone)||deliveryDay,eventTime=timeHM(eventValue,cfg.timeZone);if(!p.delivered&&window&&window!=='-')return[deliveryDay,window].filter(Boolean).join(' · ');const event=[eventDay,eventTime].filter(Boolean).join(' · ');return event||[deliveryDay,window&&window!=='-'?window:''].filter(Boolean).join(' · ')||text(p.tracking)}
function render(){if(!packages.length){c.innerHTML='<div class="state">'+esc(labels.empty)+'</div>';return}const list=el('div','list');for(const p of packages){const row=el('article','p');row.tabIndex=0;row.setAttribute('role','button');const carrier=el('div','carrier'),img=document.createElement('img');img.src='icon.svg';img.alt='PostNL';carrier.append(img);const meta=el('div','meta'),sender=el('div','sender',text(p.sender||p.title||p.tracking||'PostNL')),cn=el('div','carriername','PostNL'),detail=el('div','detail',rowSummary(p));meta.append(sender,cn,detail);const badge=el('div','badge',text(p.status)||'—');badge.title=text(p.status);row.append(carrier,meta,badge);row.addEventListener('click',()=>openPopup(p));row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPopup(p)}});list.append(row)}c.replaceChildren(list)}
(async()=>{try{const ids=Homey.getDeviceIds(),id=ids[0]||'';const x=await Homey.api('GET','/?deviceId='+encodeURIComponent(id),{});cfg.locale=L(x.locale);cfg.timeZone=x.timeZone||'UTC';labels=i18n[cfg.locale];title.textContent=labels.title;if(!x.authenticated){c.innerHTML='<div class="state">'+esc(labels.login)+'</div>';return}packages=Array.isArray(x.packages)?x.packages:[];render()}catch(e){c.innerHTML='<div class="state">'+esc(e.message||e)+'</div>'}})();close.onclick=closePopup;modal.onclick=e=>{if(e.target===modal)closePopup()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closePopup()});Homey.ready()}
</script></body></html>
