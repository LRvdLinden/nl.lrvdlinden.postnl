<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color:#232323;font:14px/1.28 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .card{display:grid;grid-template-rows:52px minmax(0,1fr);width:100%;height:100%;overflow:hidden;border-radius:17px;background:#f4f4f5;box-shadow:0 1px 1px #0000000d}
    header{display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #dedee0;background:#fafafa}.app-icon{display:block;width:36px;height:36px;object-fit:contain}h1{margin:0 0 0 auto;color:#77767b;font-size:18px;font-weight:600;white-space:nowrap}
    #content{min-height:0;overflow-y:auto;padding:10px 12px 14px;scrollbar-width:thin}.list{display:grid;gap:8px}.parcel{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:54px;padding:8px 10px;border:1px solid #e0e0e2;border-radius:11px;background:#fff}.parcel.clickable{cursor:pointer}.pkg-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:9px;background:#f3f3f4}.pkg-icon img{width:24px;height:24px}.meta{min-width:0}.sender{overflow:hidden;font-weight:750;text-overflow:ellipsis;white-space:nowrap}.status{margin-top:2px;overflow:hidden;color:#747378;font-size:12px;text-overflow:ellipsis;white-space:nowrap}.detail{margin-top:2px;overflow:hidden;color:#97969b;font-size:11px;text-overflow:ellipsis;white-space:nowrap}.phase{padding:4px 8px;border-radius:999px;background:#ececef;color:#66656a;font-size:10px;font-weight:800;white-space:nowrap}.phase.transit{background:#fff0e6;color:#b54b00}.phase.delivered{background:#e8f5ea;color:#2c7338}.state{display:grid;place-items:center;min-height:100%;padding:20px;color:#77767b;text-align:center}
    @media(prefers-color-scheme:dark){html,body{color:#f3f3f4}.card{background:#2d2d2f;box-shadow:none}header{border-color:#3b3b3d;background:#29292b}h1{color:#aaa9ad}.parcel{border-color:#424244;background:#343436}.pkg-icon{background:#252527}.status{color:#b5b4b8}.detail{color:#96959a}.phase{background:#4a4a4d;color:#e2e1e4}.phase.transit{background:#58341d;color:#ffc99f}.phase.delivered{background:#27472d;color:#bce7c4}.state{color:#aaa9ad}}
  </style>
</head>
<body>
  <main class="card"><header><img class="app-icon" src="icon.svg" alt="PostNL"><h1 id="title">Mijn Pakket</h1></header><section id="content"><div class="state">Pakketten ophalen…</div></section></main>
  <script>
    const content=document.getElementById('content'),title=document.getElementById('title');
    const words={nl:{title:'Mijn Pakket',loading:'Pakketten ophalen…',empty:'Geen recente pakketten.',login:'Koppel eerst je PostNL-account.',incoming:'Inkomend',transit:'Onderweg',delivered:'Bezorgd'},en:{title:'My Package',loading:'Loading packages…',empty:'No recent packages.',login:'Connect your PostNL account first.',incoming:'Incoming',transit:'In transit',delivered:'Delivered'}};
    function langOf(v){return String(v||'nl').toLowerCase().split('-')[0]==='nl'?'nl':'en'}
    function dateLabel(v,lang,tz){const d=new Date(v);if(Number.isNaN(d.getTime()))return '';return new Intl.DateTimeFormat(lang==='nl'?'nl-NL':'en-GB',{day:'numeric',month:'short',timeZone:tz}).format(d)}
    function phaseOf(item){const s=String(item.status||'').toLowerCase();if(item.delivered||/(bezorgd|delivered)/.test(s))return 2;if(item.deliveryWindow||item.deliveryWindowFrom||/(onderweg|transit|gesorteerd|bezorger|out for delivery|transport|route|sorting)/.test(s))return 1;return 0}
    function render(data){const lang=langOf(data.locale),t=words[lang];title.textContent=t.title;if(!data.authenticated){content.innerHTML=`<div class="state">${t.login}</div>`;return}const packages=data.packages||[];if(!packages.length){content.innerHTML=`<div class="state">${t.empty}</div>`;return}const list=document.createElement('div');list.className='list';for(const item of packages){const phase=phaseOf(item),labels=[t.incoming,t.transit,t.delivered];const row=document.createElement('article');row.className='parcel'+(item.detailsUrl?' clickable':'');const icon=document.createElement('div');icon.className='pkg-icon';icon.innerHTML='<img src="package.svg" alt="">';const meta=document.createElement('div');meta.className='meta';const sender=document.createElement('div');sender.className='sender';sender.textContent=item.sender||item.title||item.barcode||'PostNL';const status=document.createElement('div');status.className='status';const rawStatus=String(item.status||'');const generic=/^pakket is (inkomend|onderweg|bezorgd)$/i.test(rawStatus);status.textContent=rawStatus&&!generic?rawStatus:labels[phase];const detail=document.createElement('div');detail.className='detail';detail.textContent=item.deliveryWindow||dateLabel(item.deliveryDate||item.deliveryWindowFrom||item.createdAt,lang,data.timeZone)||item.barcode||'';meta.append(sender,status,detail);const badge=document.createElement('div');badge.className='phase'+(phase===1?' transit':phase===2?' delivered':'');badge.textContent=labels[phase];row.append(icon,meta,badge);if(item.detailsUrl)row.onclick=()=>window.open(item.detailsUrl,'_blank','noopener,noreferrer');list.appendChild(row)}content.replaceChildren(list)}
    async function load(){content.innerHTML=`<div class="state">${words.nl.loading}</div>`;try{render(await Homey.api('GET','/?deviceId='+encodeURIComponent((Homey.getDeviceIds()||[])[0]||''),{}))}catch(e){content.innerHTML=`<div class="state">${String(e.message||e)}</div>`}}
    async function onHomeyReady(Homey){await load();Homey.ready()}
  </script>
</body>
</html>
